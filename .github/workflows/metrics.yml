name: Profile metrics

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "metrics.svg"
      - "scripts/generate_metrics.py"
      - ".github/workflows/metrics.yml"
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate language card
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/generate_metrics.py

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.svg
          if git diff --cached --quiet; then
            echo "Language metrics are unchanged."
            exit 0
          fi
          git commit -m "chore: refresh top-four language metrics [skip ci]"
          git push
