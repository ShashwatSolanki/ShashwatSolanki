name: Profile metrics

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Skip until the metrics token is configured
        if: ${{ env.METRICS_TOKEN == '' }}
        run: echo "::notice::Add the METRICS_TOKEN repository secret to enable profile metrics."

      - name: Generate profile metrics
        if: ${{ env.METRICS_TOKEN != '' }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: ShashwatSolanki
          filename: metrics.svg
          base: header, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: >-
            HTML, CSS, SCSS, Makefile, Dockerfile
          output_action: commit
          committer_message: "chore: refresh profile metrics [Skip GitHub Action]"
          retries: 3
          retries_delay: 60
