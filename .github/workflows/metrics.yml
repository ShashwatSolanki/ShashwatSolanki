name: Profile metrics

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/metrics.yml"
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Skip until the metrics token is configured
        if: ${{ env.METRICS_TOKEN == '' }}
        run: echo "::notice::Add the METRICS_TOKEN repository secret to enable profile metrics."

      - name: Generate language distribution
        if: ${{ env.METRICS_TOKEN != '' }}
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: ShashwatSolanki
          filename: metrics.svg
          base: ""
          config_order: languages
          config_display: regular
          config_padding: 0, 4
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_threshold: 1%
          plugin_languages_ignored: >-
            HTML, CSS, SCSS, Makefile, Dockerfile
          output_action: commit
          committer_message: "chore: refresh language metrics [Skip GitHub Action]"
          retries: 3
          retries_delay: 60
